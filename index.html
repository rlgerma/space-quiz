<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Space Exploration Quiz</title>
<style>
  :root {
    --bg: #f4f5fb;
    --star-base: #696da8;
    --star-warm: #d9480f;
    --nebula-strength: 0.6;
    --nebula-blend: normal;
    --bg-accent: radial-gradient(circle at 20% 0%, #e3e6ff 0%, transparent 55%), radial-gradient(circle at 100% 100%, #ffe6f3 0%, transparent 50%);
    --card: #ffffff;
    --text: #1c1e2b;
    --muted: #51576e;
    --border: #e1e4ef;
    --option: #f7f8fc;
    --option-hover: #eef0fb;
    --accent: #5b5bf0;
    --accent-2: #b14cf0;
    --good: #16a34a;
    --good-bg: #dcfce7;
    --good-text: #17632f;
    --good-key-text: #102a18;
    --bad: #dc2626;
    --bad-bg: #fee2e2;
    --bad-text: #a51d27;
    --bad-key-text: #fff;
    --glass: rgba(247, 248, 255, 0.92);
    --glass-blurred: rgba(247, 248, 255, 0.87);
    --track: #e6e8f2;
    --shadow: 0 10px 30px rgba(30, 35, 90, 0.08), 0 2px 6px rgba(30, 35, 90, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d1a;
      --star-base: #dce5ff;
      --star-warm: #ffd27a;
      --nebula-strength: 0.95;
      --nebula-blend: screen;
      --bg-accent: radial-gradient(circle at 20% 0%, #1d1f4a 0%, transparent 55%), radial-gradient(circle at 100% 100%, #2c1438 0%, transparent 50%);
      --card: #151829;
      --text: #e8eaf6;
      --muted: #b6bdd5;
      --border: #262a44;
      --option: #1b1f35;
      --option-hover: #23284a;
      --accent: #8b8bff;
      --accent-2: #d17bff;
      --good: #4ade80;
      --good-bg: #183c2b;
      --good-text: #86efac;
      --good-key-text: #102a18;
      --bad: #f87171;
      --bad-bg: #49262f;
      --bad-text: #fda4af;
      --bad-key-text: #321318;
      --glass: rgba(21, 24, 41, 0.94);
      --glass-blurred: rgba(21, 24, 41, 0.90);
      --track: #252a45;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg-accent), var(--bg);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
  }
  #nebula, #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #nebula {
    --level: 0;
    opacity: calc(var(--level) * var(--nebula-strength));
    mix-blend-mode: var(--nebula-blend);
  }
  #nebula i {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    will-change: transform;
  }
  #nebula .blob { width: 90vmax; height: 90vmax; margin: -45vmax 0 0 -45vmax; }
  #nebula .red { background: radial-gradient(circle, rgba(255, 59, 48, 0.6), rgba(255, 59, 48, 0) 62%); }
  #nebula .orange { background: radial-gradient(circle, rgba(255, 138, 0, 0.55), rgba(255, 138, 0, 0) 62%); }
  #nebula .gold { background: radial-gradient(circle, rgba(255, 207, 64, 0.5), rgba(255, 207, 64, 0) 60%); }
  #nebula .vortex {
    width: 110vmax; height: 110vmax; margin: -55vmax 0 0 -55vmax;
    opacity: 0;
    background: conic-gradient(
      rgba(255, 90, 40, 0) 0deg, rgba(255, 90, 40, 0.55) 35deg, rgba(255, 90, 40, 0) 80deg,
      rgba(255, 196, 64, 0) 120deg, rgba(255, 196, 64, 0.5) 155deg, rgba(255, 196, 64, 0) 200deg,
      rgba(255, 56, 86, 0) 240deg, rgba(255, 56, 86, 0.5) 275deg, rgba(255, 56, 86, 0) 320deg);
    -webkit-mask-image: radial-gradient(circle, transparent 8%, #000 22%, rgba(0, 0, 0, 0.5) 42%, transparent 66%);
    mask-image: radial-gradient(circle, transparent 8%, #000 22%, rgba(0, 0, 0, 0.5) 42%, transparent 66%);
  }
  #starfield {
    --intensity: 0;
    --sx: 0px;
    --sy: 0px;
    --star-color: color-mix(in srgb, var(--star-base), var(--star-warm) calc(var(--intensity) * 55%));
    opacity: calc(0.25 + var(--intensity) * 0.6);
  }
  #starfield::before, #starfield::after {
    content: "";
    position: absolute;
    inset: 0;
  }
  #starfield::before {
    background-image:
      radial-gradient(circle at 20px 30px, var(--star-color) 0 0.7px, transparent 1.5px),
      radial-gradient(circle at 80px 130px, var(--star-color) 0 0.9px, transparent 1.6px),
      radial-gradient(circle at 110px 70px, var(--star-color) 0 0.6px, transparent 1.2px),
      radial-gradient(circle at 210px 160px, var(--star-color) 0 1px, transparent 1.8px);
    background-size: 193px 211px, 293px 307px, 137px 173px, 349px 257px;
    background-position: var(--sx) var(--sy);
    opacity: 0.7;
  }
  #starfield::after {
    background-image:
      radial-gradient(circle at 54px 91px, var(--star-color) 0 1px, transparent 2px),
      radial-gradient(circle at 190px 41px, var(--star-color) 0 1.4px, transparent 2.6px);
    background-size: 313px 347px, 479px 389px;
    background-position: calc(var(--sx) * 1.8) calc(var(--sy) * 1.8);
    opacity: 0.55;
    filter: drop-shadow(0 0 calc(1px + var(--intensity) * 3px) var(--star-color));
    animation: star-twinkle 7s ease-in-out infinite alternate;
  }
  @keyframes star-twinkle {
    from { opacity: 0.35; }
    to { opacity: 0.7; }
  }
  header { text-align: center; margin-bottom: 20px; }
  header h1 {
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .card {
    --rim: #916cff;
    background: var(--glass);
    border: 1px solid #916cff;
    border-color: var(--rim);
    border-radius: 16px;
    box-shadow: var(--shadow), 0 0 24px -8px var(--rim), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    padding: 22px;
  }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .card {
      background: var(--glass-blurred);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .difficulty-badge {
    font-weight: 600;
    color: var(--text);
  }
  .difficulty-options {
    display: grid;
    gap: 10px;
    margin: 0;
    padding: 0;
    border: 0;
  }
  .difficulty-options legend {
    margin-bottom: 10px;
    font-weight: 600;
  }
  .difficulty-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--option);
    cursor: pointer;
  }
  .difficulty-option:has(input:checked) { border-color: var(--accent); background: var(--option-hover); }
  .difficulty-option:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .difficulty-option input { accent-color: var(--accent); }
  .difficulty-option span { display: grid; }
  .difficulty-option small { color: var(--muted); font-size: 13px; }
  .btn:disabled { cursor: not-allowed; opacity: 0.55; }
  .score {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    color: var(--text);
    background: var(--option);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .score.bump { animation: bump 0.45s ease; }

  .progress {
    position: relative;
    height: 36px;
    margin-bottom: 20px;
  }
  .flight-path {
    position: relative;
    height: 100%;
    margin: 0 12px;
  }
  .flight-rail, .flight-trail {
    position: absolute;
    top: 50%;
    left: 0;
    height: 3px;
    border-radius: 999px;
    transform: translateY(-50%);
  }
  .flight-rail {
    right: 0;
    background: var(--track);
  }
  .flight-trail {
    width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 8px var(--accent-2);
    transition: width 450ms cubic-bezier(.4, 0, .2, 1);
  }
  .launch-pad, .progress-waypoint, .progress-rocket {
    position: absolute;
    top: 50%;
    z-index: 1;
    transform: translate(-50%, -50%);
  }
  .launch-pad {
    left: 0;
    width: 10px;
    height: 10px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    background: var(--card);
    box-shadow: 0 0 8px var(--accent);
  }
  .progress-waypoint {
    left: calc(var(--step) * 10%);
    color: var(--muted);
    font-size: 12px;
    line-height: 1;
    transition: color 250ms ease, filter 250ms ease;
  }
  .progress-waypoint.complete {
    color: var(--accent-2);
    filter: drop-shadow(0 0 4px var(--accent-2));
  }
  .progress-rocket {
    left: 0;
    width: 24px;
    height: 24px;
    color: var(--text);
    filter: drop-shadow(0 0 4px var(--accent));
    transition: left 450ms cubic-bezier(.4, 0, .2, 1);
  }
  .progress-rocket::after {
    content: "";
    position: absolute;
    top: 50%;
    right: calc(100% - 3px);
    width: 12px;
    height: 3px;
    border-radius: 50%;
    background: linear-gradient(90deg, transparent, #ffae57);
    opacity: 0;
    transform: translateY(-50%);
  }
  .progress.is-moving .progress-rocket::after {
    animation: engine-burst 550ms ease-out both;
  }
  @keyframes engine-burst {
    0% { opacity: 0.95; width: 4px; }
    100% { opacity: 0; width: 18px; }
  }

  .question {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 16px;
    line-height: 1.4;
  }
  .question .emoji { margin-right: 6px; }

  .options { display: grid; gap: 10px; }
  .option {
    font: inherit;
    font-size: 15px;
    text-align: left;
    color: var(--text);
    background: var(--option);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .option:hover:not(:disabled) { background: var(--option-hover); border-color: var(--accent); }
  .option:active:not(:disabled) { transform: scale(0.99); }
  .option:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .option .key {
    flex: none;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 600;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .option.correct {
    background: var(--good-bg);
    border-color: var(--good);
    animation: pop 0.45s ease;
  }
  .option.correct .key { background: var(--good); border-color: var(--good); color: var(--good-key-text); }
  .option.wrong {
    background: var(--bad-bg);
    border-color: var(--bad);
    animation: shake 0.45s ease;
  }
  .option.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--bad-key-text); }
  .option.dim { border-color: transparent; }

  .feedback {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 14px;
    display: none;
    animation: slideUp 0.3s ease;
  }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-bg); color: var(--text); border-left: 4px solid var(--good); }
  .feedback.bad { background: var(--bad-bg); color: var(--text); border-left: 4px solid var(--bad); }
  .feedback strong { display: block; margin-bottom: 2px; }
  .feedback.good strong { color: var(--good-text); }
  .feedback.bad strong { color: var(--bad-text); }

  .btn {
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    width: 100%;
    margin-top: 16px;
    padding: 12px 16px;
    border: 0;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(90deg, #4034a0, #762b91);
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(0.99); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .btn[hidden], #next[hidden] { display: none; }
  #next {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #next .timer-fill {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.16);
    transform-origin: left center;
    transform: scaleX(0);
    pointer-events: none;
  }
  #next .label, #next .countdown { position: relative; }
  #next .countdown {
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 1px 8px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.18);
  }

  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; }

  /* Results */
  .results { text-align: center; padding: 8px 0 4px; }
  .mission-patch {
    --patch-accent: #aebfe0;
    --patch-glow: rgba(174, 191, 224, 0.25);
    position: relative;
    display: grid;
    place-items: center;
    width: min(100%, 260px);
    aspect-ratio: 1;
    margin: 0 auto;
    border: 2px solid var(--patch-accent);
    border-radius: 50%;
    color: #fff;
    background: radial-gradient(circle at 50% 30%, #293b60, #10182d 72%);
    box-shadow: inset 0 0 0 5px #10182d, inset 0 0 0 6px var(--patch-accent), 0 8px 24px var(--patch-glow);
    animation: patch-arrive 0.65s ease-out both;
  }
  .mission-patch.scout { --patch-accent: #b7c8e8; --patch-glow: rgba(130, 159, 209, 0.25); }
  .mission-patch.traveler { --patch-accent: #80e2d4; --patch-glow: rgba(73, 193, 176, 0.3); }
  .mission-patch.explorer { --patch-accent: #bcb3ff; --patch-glow: rgba(152, 135, 255, 0.3); }
  .mission-patch.voyager { --patch-accent: #ffb59c; --patch-glow: rgba(255, 144, 117, 0.3); }
  .mission-patch.commander {
    --patch-accent: #ffdb77;
    --patch-glow: rgba(238, 177, 42, 0.45);
    background: radial-gradient(circle at 50% 30%, #584520, #1d1b2b 72%);
  }
  .patch-orbit {
    position: absolute;
    inset: 9%;
    width: 82%;
    height: 82%;
    fill: none;
    stroke: var(--patch-accent);
    stroke-width: 1;
    pointer-events: none;
  }
  .patch-orbit ellipse {
    stroke-dasharray: 500;
    animation: orbit-draw 0.75s ease-out both;
  }
  .patch-orbit .orbit-dots { stroke-dasharray: 2 5; opacity: 0.65; }
  .patch-content {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 3px;
    width: 75%;
  }
  .patch-label, .patch-tier {
    color: var(--patch-accent);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .patch-insignia { color: var(--patch-accent); font-size: 16px; line-height: 1; letter-spacing: 0.12em; }
  .results .big-emoji { font-size: 43px; line-height: 1; }
  .patch-score {
    display: grid;
    place-items: center;
    min-width: 74px;
    padding: 2px 10px;
    border: 1px solid var(--patch-accent);
    border-radius: 999px;
    background: #10182d;
    font-size: 20px;
    font-weight: 800;
    line-height: 1.2;
  }
  .results h2 { font-size: 20px; margin: 14px 0 4px; }
  .difficulty-result { font-weight: 600; margin: 0 0 4px; }
  .results .final { font-size: 15px; color: var(--muted); margin: 0 0 18px; }
  .summary {
    display: flex; justify-content: center; gap: 4px;
    margin: 14px 0 0;
  }
  .summary i {
    flex: 0 1 22px; min-width: 0; height: 6px; border-radius: 3px;
    background: var(--bad);
  }
  .summary i.ok { background: var(--good); }

  .fade-in { animation: fadeIn 0.35s ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes patch-arrive {
    from { opacity: 0; transform: scale(0.94) rotate(-4deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes orbit-draw {
    from { stroke-dashoffset: 500; }
    to { stroke-dashoffset: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #starfield::before, #starfield::after { animation: none; }
    .mission-patch, .patch-orbit ellipse { animation: none; }
    .progress-rocket, .flight-trail, .progress-waypoint { transition: none; }
    .progress.is-moving .progress-rocket::after { animation: none; }
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="nebula" aria-hidden="true"><i class="vortex"></i><i class="blob red"></i><i class="blob orange"></i><i class="blob gold"></i></div>
<div id="starfield" aria-hidden="true"></div>
<main>
  <header>
    <h1>🚀 Space Exploration Quiz</h1>
    <p>Choose your level and launch into 10 questions</p>
  </header>

  <section class="card" id="card" aria-live="polite">
    <div id="quiz">
      <div class="meta">
        <span id="counter">Question 1 of 10</span>
        <span class="difficulty-badge" id="difficultyBadge"></span>
        <span class="score" id="score" aria-label="Score">⭐ <span id="scoreVal">0</span></span>
      </div>
      <div class="progress" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress">
        <div class="flight-path" aria-hidden="true">
          <span class="flight-rail"></span>
          <span class="flight-trail" id="progressTrail"></span>
          <span class="launch-pad"></span>
          <span class="progress-waypoint" style="--step: 1" aria-hidden="true">★</span>
          <span class="progress-waypoint" style="--step: 2" aria-hidden="true">★</span>
          <span class="progress-waypoint" style="--step: 3" aria-hidden="true">★</span>
          <span class="progress-waypoint" style="--step: 4" aria-hidden="true">★</span>
          <span class="progress-waypoint" style="--step: 5" aria-hidden="true">★</span>
          <span class="progress-waypoint" style="--step: 6" aria-hidden="true">★</span>
          <span class="progress-waypoint" style="--step: 7" aria-hidden="true">★</span>
          <span class="progress-waypoint" style="--step: 8" aria-hidden="true">★</span>
          <span class="progress-waypoint" style="--step: 9" aria-hidden="true">★</span>
          <span class="progress-waypoint" style="--step: 10" aria-hidden="true">★</span>
          <svg class="progress-rocket" id="progressRocket" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.4 3.2c2.8-1 5-.9 6.4-.7.2 1.4.3 3.6-.7 6.4l-5.8 7.4-5.5-1.8-1.8-5.5 7.4-5.8Z" fill="currentColor"/>
            <path d="m8.8 9-4.1.8-2.2 3.7 5.2-.5m7.5 2.8-.8 4.1-3.7 2.2.5-5.2" fill="currentColor"/>
            <circle cx="15.8" cy="8.2" r="1.7" fill="var(--card)"/>
          </svg>
        </div>
      </div>
      <h2 class="question" id="question"></h2>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback" role="status"></div>
      <button class="btn" id="next" hidden>Next question →</button>
      <p class="hint">Press 1–4 to answer. Auto-advances after 5s; Enter skips the wait.</p>
    </div>
  </section>
</main>

<script>
  const DIFFICULTIES = {
    easy: {
      name: "Artemis Cadet", level: "Easy",
      description: "Recognizable planets, famous astronauts, and iconic missions",
      questions: [
        { emoji: "🔴", q: "Which planet is known as the Red Planet?",
          options: ["Venus", "Mars", "Mercury", "Jupiter"], answer: 1,
          fact: "Iron oxide (rust) in Martian soil gives Mars its reddish hue.",

        { emoji: "❄️", q: "Which spacecraft made the first close-up flyby of Pluto?",

        { emoji: "🔭", q: "Which space shuttle carried the Hubble Space Telescope into orbit?",

    hard: {

          options: ["Lunar surface elevation with laser pulses", "Moonquakes with seismometers", "Water vapor with radar", "Lunar gravity with radio waves"], answer: 0,

          source: "https://science.nasa.gov/mission/lro/" },

          fact: "The impact exposed material beneath Tempel 1's surface for study.",
          source: "https://science.nasa.gov/mission/deep-impact-epoxi/" },
        { emoji: "🔵", q: "Which two planets have only been visited up close by Voyager 2?",
          options: ["Mercury and Venus", "Uranus and Neptune", "Mars and Jupiter", "Saturn and Pluto"], answer: 1,
          fact: "Voyager 2 remains the only spacecraft to have flown by Uranus and Neptune.",
          source: "https://science.nasa.gov/mission/voyager/" },
      ],

  };

  const RESULTS = [
    { min: 100, tier: "commander", insignia: "★ ★ ★ ★ ★", emoji: "🏆", title: "Mission Commander!", text: "A perfect score — NASA should be calling you." },
    { min: 80,  tier: "voyager", insignia: "★ ★ ★ ★", emoji: "🚀", title: "Stellar work!", text: "You clearly know your way around the cosmos." },
    { min: 60,  tier: "explorer", insignia: "★ ★ ★", emoji: "🌟", title: "Nice orbit!", text: "Solid knowledge with room to explore further." },
    { min: 40,  tier: "traveler", insignia: "★ ★", emoji: "🛸", title: "Getting there!", text: "You're out of the atmosphere — keep climbing." },
    { min: 0,   tier: "scout", insignia: "★", emoji: "🌑", title: "Houston, we have a problem", text: "Time to brush up and launch again!" },
  ];

  const $ = (id) => document.getElementById(id);
  const card = $("card");
  const starfield = $("starfield");
  const nebula = $("nebula");
  const blobs = [...nebula.querySelectorAll(".blob")];
  const vortex = nebula.querySelector(".vortex");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  // Lissajous paths (vw/vh) for each nebula blob.
  const BLOB_PATHS = [
    { ox: -18, oy: -16, ax: 26, ay: 20, fx: 1.0, fy: 0.8, p: 0 },
    { ox: 20, oy: 18, ax: 24, ay: 24, fx: 0.7, fy: 1.1, p: 2.1 },
    { ox: 4, oy: -2, ax: 30, ay: 18, fx: 1.3, fy: 0.6, p: 4.2 },
  ];
  const cosmos = { level: 0, target: 0, phase: 0, last: performance.now(), sx: null };

  function setCosmos(target) {
    cosmos.target = target;
  }

  function renderCosmos(now) {
    const dt = Math.max(0, Math.min(0.064, (now - cosmos.last) / 1000));
    cosmos.last = now;
    const still = reduceMotion.matches;
    cosmos.level = still ? cosmos.target : cosmos.level + (cosmos.target - cosmos.level) * (1 - Math.exp(-dt * 1.8));
    if (Math.abs(cosmos.target - cosmos.level) < 0.0005) cosmos.level = cosmos.target;
    const L = cosmos.level;
    // Motion speed ramps quadratically: nearly static at 0, frenetic at 10/10.
    if (!still) cosmos.phase += dt * (0.015 + 0.85 * L * L);
    const t = cosmos.phase;

    starfield.style.setProperty("--intensity", L.toFixed(4));
    nebula.style.setProperty("--level", Math.pow(L, 0.85).toFixed(4));
    card.style.setProperty("--rim", `rgb(${Math.round(145 + 110 * L)}, ${Math.round(108 + 82 * L)}, ${Math.round(255 - 160 * L)})`);
    blobs.forEach((b, i) => {
      const p = BLOB_PATHS[i];
      const x = p.ox + p.ax * Math.sin(t * p.fx + p.p);
      const y = p.oy + p.ay * Math.cos(t * p.fy + p.p);
      const s = 0.65 + 0.45 * L + 0.08 * Math.sin(t * 1.7 + p.p);
      b.style.transform = `translate(${x.toFixed(2)}vw, ${y.toFixed(2)}vh) scale(${s.toFixed(3)})`;
    });
    const v = Math.min(1, Math.max(0, (L - 0.35) / 0.65));
    vortex.style.opacity = (v * v * (3 - 2 * v)).toFixed(3);
    vortex.style.transform = `rotate(${(t * 70).toFixed(2)}deg) scale(${(0.8 + 0.4 * L).toFixed(3)})`;

    const sx = Math.round(-t * 60 * 2) / 2;
    if (sx !== cosmos.sx) {
      cosmos.sx = sx;
      starfield.style.setProperty("--sx", sx + "px");
      starfield.style.setProperty("--sy", Math.round(t * 35 * 2) / 2 + "px");
    }
    requestAnimationFrame(renderCosmos);
  }
  const quizHTML = $("quiz").outerHTML;

  const AUTO_ADVANCE_MS = 5000;
  let index, score, answered, history, timerFrame, selectedLevel, activeQuestions;

  function showDifficulty() {
    cancelAnimationFrame(timerFrame);
    card.innerHTML = `
      <div id="difficulty-selection">
        <h2 id="difficulty-heading" class="question">Choose your difficulty</h2>
        <form id="difficulty-form">
          <fieldset class="difficulty-options">
            <legend>Select one launch level</legend>
            ${Object.entries(DIFFICULTIES).map(([key, difficulty]) => `
              <label class="difficulty-option">
                <input type="radio" name="difficulty" value="${key}"${selectedLevel === key ? " checked" : ""}>
                <span><strong>${difficulty.name}</strong><small>${difficulty.level} · ${difficulty.description}</small></span>
              </label>`).join("")}
          </fieldset>
          <button class="btn" id="launch" type="submit"${selectedLevel ? "" : " disabled"}>Launch quiz 🚀</button>
        </form>
      </div>`;
    const form = $("difficulty-form");
    form.addEventListener("change", (event) => {
      if (event.target.name === "difficulty") {
        selectedLevel = event.target.value;
        $("launch").disabled = false;
      }
    });
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const choice = form.querySelector('input[name="difficulty"]:checked');
      if (choice) start(choice.value);
    });
    const choice = form.querySelector('input[name="difficulty"]:checked');
    (choice || form.querySelector('input[name="difficulty"]')).focus({ preventScroll: true });
  }

  function start(level = selectedLevel) {
    if (!DIFFICULTIES[level]) return;
    cancelAnimationFrame(timerFrame);
    selectedLevel = level;
    activeQuestions = DIFFICULTIES[selectedLevel].questions;
    card.innerHTML = quizHTML;
    $("difficultyBadge").textContent = `${DIFFICULTIES[selectedLevel].name} · ${DIFFICULTIES[selectedLevel].level}`;
    index = 0; score = 0; history = [];
    setCosmos(0);
    $("next").addEventListener("click", next);
    render();
  }

  function render() {
    const item = activeQuestions[index];
    answered = false;
    $("counter").textContent = `Question ${index + 1} of ${activeQuestions.length}`;
    $("scoreVal").textContent = score;
    setProgress(index);

    const qEl = $("question");
    qEl.innerHTML = "";
    const e = document.createElement("span");
    e.className = "emoji"; e.setAttribute("aria-hidden", "true"); e.textContent = item.emoji;
    qEl.append(e, document.createTextNode(item.q));
    qEl.classList.remove("fade-in"); void qEl.offsetWidth; qEl.classList.add("fade-in");

    const opts = $("options");
    opts.innerHTML = "";
    opts.classList.remove("fade-in"); void opts.offsetWidth; opts.classList.add("fade-in");
    item.options.forEach((text, i) => {
      const b = document.createElement("button");
      b.className = "option";
      b.type = "button";
      b.innerHTML = `<span class="key">${i + 1}</span><span></span>`;
      b.lastChild.textContent = text;
      b.addEventListener("click", () => choose(i));
      opts.appendChild(b);
    });

    const fb = $("feedback");
    fb.className = "feedback";
    fb.innerHTML = "";
    $("next").hidden = true;
  }

  function setProgress(done) {
    const pct = (done / activeQuestions.length) * 100;
    const progress = $("progress");
    progress.classList.remove("is-moving");
    $("progressTrail").style.width = pct + "%";
    $("progressRocket").style.left = pct + "%";
    [...progress.querySelectorAll(".progress-waypoint")].forEach((waypoint, i) => {
      waypoint.classList.toggle("complete", i < done);
    });
    $("progress").setAttribute("aria-valuenow", done);
  }

  function choose(i) {
    if (answered) return;
    answered = true;
    const item = activeQuestions[index];
    const buttons = [...$("options").children];
    const correct = i === item.answer;
    history.push(correct);

    buttons.forEach((b, j) => {
      b.disabled = true;
      if (j === item.answer) b.classList.add("correct");
      else if (j === i) b.classList.add("wrong");
      else b.classList.add("dim");
    });

    if (correct) {
      score++;
      setCosmos(score / activeQuestions.length);
      $("scoreVal").textContent = score;
      const s = $("score");
      s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump");
    }

    const fb = $("feedback");
    fb.className = "feedback show " + (correct ? "good" : "bad");
    fb.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Not quite — it's " + item.options[item.answer] + "."}</strong><span></span>`;
    fb.lastChild.textContent = item.fact;

    setProgress(index + 1);
    const progress = $("progress");
    if (!reduceMotion.matches) {
      void progress.offsetWidth;
      progress.classList.add("is-moving");
    }
    const nb = $("next");
    nb.innerHTML = `<span class="timer-fill" aria-hidden="true"></span><span class="label"></span><span class="countdown" aria-hidden="true"></span>`;
    nb.querySelector(".label").textContent = index === activeQuestions.length - 1 ? "See results 🎉" : "Next question →";
    nb.hidden = false;
    nb.focus({ preventScroll: true });
    startTimer(nb);
  }

  function startTimer(nb) {
    const fill = nb.querySelector(".timer-fill");
    const count = nb.querySelector(".countdown");
    count.textContent = Math.ceil(AUTO_ADVANCE_MS / 1000) + "s";
    const t0 = performance.now();
    const tick = (now) => {
      const elapsed = now - t0;
      fill.style.transform = `scaleX(${Math.min(1, elapsed / AUTO_ADVANCE_MS)})`;
      count.textContent = Math.max(0, Math.ceil((AUTO_ADVANCE_MS - elapsed) / 1000)) + "s";
      if (elapsed >= AUTO_ADVANCE_MS) next();
      else timerFrame = requestAnimationFrame(tick);
    };
    timerFrame = requestAnimationFrame(tick);
  }

  function next() {
    if (!answered) return;
    cancelAnimationFrame(timerFrame);
    index++;
    if (index < activeQuestions.length) render();
    else showResults();
  }

  function showResults() {
    const difficulty = DIFFICULTIES[selectedLevel];
    const pct = Math.round((score / activeQuestions.length) * 100);
    const r = RESULTS.find((x) => pct >= x.min);
    card.innerHTML = `
      <div class="results">
        <div class="mission-patch ${r.tier}">
          <svg class="patch-orbit" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="orbit-dots" cx="100" cy="100" r="95"></circle>
            <ellipse cx="100" cy="100" rx="96" ry="70" transform="rotate(-35 100 100)"></ellipse>
          </svg>
          <div class="patch-content">
            <span class="patch-label">Mission complete</span>
            <span class="patch-insignia" aria-hidden="true">${r.insignia}</span>
            <span class="big-emoji" aria-hidden="true">${r.emoji}</span>
            <span class="patch-score" aria-label="${score} out of ${activeQuestions.length}">${score}/${activeQuestions.length}</span>
            <span class="patch-tier">${r.tier}</span>
          </div>
        </div>
        <h2>${r.title}</h2>
        <p class="difficulty-result">${difficulty.name} · ${difficulty.level}</p>
        <p class="final">${r.text}</p>
        <div class="summary" role="img" aria-label="Answer summary: ${history.map((ok, i) => `question ${i + 1} ${ok ? "correct" : "wrong"}`).join(", ")}">
          ${history.map((ok, i) => `<i class="${ok ? "ok" : ""}" title="Q${i + 1}: ${ok ? "correct" : "wrong"}"></i>`).join("")}
        </div>
        <button class="btn" id="restart">Play ${difficulty.name} again ↻</button>
        <button class="btn" id="chooseDifficulty">Choose another level</button>
      </div>`;
    $("restart").addEventListener("click", () => start());
    $("chooseDifficulty").addEventListener("click", showDifficulty);
    $("restart").focus({ preventScroll: true });
  }

  document.addEventListener("keydown", (e) => {
    if (!$("options")) return;
    const n = parseInt(e.key, 10);
    if (!answered && n >= 1 && n <= 4) choose(n - 1);
    else if (answered && e.key === "Enter" && document.activeElement !== $("next")) next();
  });

  showDifficulty();
  requestAnimationFrame(renderCosmos);
</script>
